    <!-- CUSTOM CSS -->
    <style amp-custom>
      :root {
        --bg: #050a14;
        --text: #e6f1ff;
        --panel: #0b1526;
        --silver: #e2e8f0;
        --silver-glow: #cbd5e1;
        --blue-accent: #00d2ff;
        --blue-royal: #1e3a8a;
        --blue-deep: #0a192f;
        --soft: rgba(226, 232, 240, 0.15);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }

      body {
        font-family: "Inter", sans-serif;
        color: var(--text);
        background:
          radial-gradient(
            circle at top left,
            rgba(0, 210, 255, 0.22),
            transparent 32%
          ),
          radial-gradient(
            circle at top right,
            rgba(203, 213, 225, 0.2),
            transparent 30%
          ),
          linear-gradient(180deg, #050a14 0%, #0a172c 56%, #03070f 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 16px;
      }

      .shell {
        max-width: 520px;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      .header {
        display: flex;
        justify-content: center;
        margin-bottom: 0;
      }

      .logo {
        border-radius: 8px;
        filter: drop-shadow(0 0 10px rgba(0, 210, 255, 0.3));
      }

      .marquee-wrapper {
        width: 100%;
        background: var(--panel);
        border-top: 2px solid #e2e8f0;
        border-bottom: 2px solid var(--blue-accent);
        box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
        overflow: hidden;
        padding: 8px 0;
      }

      .marquee-text {
        display: inline-block;
        white-space: nowrap;
        color: #f1f5f9;
        font-size: 13px;
        font-weight: bold;
        letter-spacing: 0.5px;
        padding-left: 100%;
        animation: marquee 12s linear infinite;
        text-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
      }

      @keyframes marquee {
        0% {
          transform: translateX(0);
        }

        100% {
          transform: translateX(-100%);
        }
      }

      .card {
        position: relative;
        background: linear-gradient(
          180deg,
          rgba(14, 30, 56, 0.85),
          rgba(10, 23, 44, 0.9) 50%,
          rgba(4, 11, 22, 0.95)
        );
        border: 2px solid transparent;
        background-clip: padding-box;
        border-radius: 18px;
        box-shadow:
          0 0 35px rgba(0, 210, 255, 0.25),
          inset 0 0 16px rgba(226, 232, 240, 0.12),
          0 12px 45px rgba(0, 0, 0, 0.7);
        overflow: hidden;
        width: 100%;
        padding: 20px;
      }

      .card:hover {
        box-shadow:
          0 0 45px rgba(0, 210, 255, 0.45),
          inset 0 0 22px rgba(255, 255, 255, 0.2),
          0 15px 50px rgba(0, 0, 0, 0.8);
        transform: scale(1.01);
      }

      .card::before {
        content: "";
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(
          circle,
          rgba(226, 232, 240, 0.25),
          transparent 70%
        );
        animation: neonWave 7s linear infinite;
        filter: blur(28px);
        z-index: 0;
      }

      @keyframes neonWave {
        0% {
          transform: translateX(-50%) translateY(-50%) rotate(0deg);
        }

        100% {
          transform: translateX(-50%) translateY(-50%) rotate(360deg);
        }
      }

      .hero {
        display: flex;
        flex-direction: column;
        gap: 16px;
        align-items: center;
        position: relative;
        z-index: 1;
      }

      .hero-img {
        border-radius: 14px;
        width: 100%;
        height: auto;
        border: 1px solid rgba(226, 232, 240, 0.25);
      }

      .intro {
        margin: 0;
        color: #e2e8f0;
        font-size: 14px;
        line-height: 1.7;
        text-align: center;
        background: rgba(11, 21, 38, 0.88);
        border: 1px solid rgba(0, 210, 255, 0.35);
        border-radius: 14px;
        padding: 12px 14px;
        box-shadow: inset 0 0 10px rgba(0, 210, 255, 0.1);
      }

      .cta {
        display: flex;
        gap: 12px;
        width: 100%;
        justify-content: center;
        flex-wrap: wrap;
        position: relative;
        z-index: 1;
      }

      .btn {
        flex: 1 1 45%;
        display: inline-block;
        text-decoration: none;
        text-align: center;
        padding: 14px 16px;
        border-radius: 12px;
        font-weight: 700;
        letter-spacing: 0.5px;
        border: 2px solid transparent;
        transition: all 0.25s ease;
        position: relative;
        overflow: hidden;
        color: #ffffff;
        background: #060e1a;
        z-index: 1;
      }

      .btn::before {
        content: "";
        position: absolute;
        top: -3px;
        left: -3px;
        right: -3px;
        bottom: -3px;
        background: conic-gradient(
          from 0deg,
          #00d2ff,
          #ffffff,
          #3b82f6,
          #94a3b8,
          #00d2ff
        );
        border-radius: 14px;
        z-index: -1;
        filter: blur(6px);
      }

      .btn::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        right: 3px;
        bottom: 3px;
        background: linear-gradient(180deg, #112240 0%, #0a1526 100%);
        border-radius: 10px;
        z-index: -1;
      }

      .btn:hover {
        transform: translateY(-1px);
        color: #00d2ff;
        box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
      }

      @keyframes rotateBorder {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes glowPulse {
        0% {
          box-shadow:
            0 0 25px rgba(0, 210, 255, 0.5),
            0 0 50px rgba(226, 232, 240, 0.3);
        }

        50% {
          box-shadow:
            0 0 45px rgba(255, 255, 255, 0.7),
            0 0 80px rgba(0, 210, 255, 0.6);
        }

        100% {
          box-shadow:
            0 0 25px rgba(0, 210, 255, 0.5),
            0 0 50px rgba(226, 232, 240, 0.3);
        }
      }

      .section-buttons {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 100%;
      }

      .badge-container {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .badge {
        flex: 1 1 30%;
        display: inline-block;
        text-decoration: none;
        text-align: center;
        padding: 10px 12px;
        border-radius: 10px;
        font-weight: 700;
        letter-spacing: 0.2px;
        border: 2px solid transparent;
        transition: all 0.25s ease;
        position: relative;
        overflow: hidden;
        color: #f1f5f9;
        background: #0a1526;
        z-index: 1;
        font-size: 12px;
      }

      .badge::before {
        content: "";
        position: absolute;
        top: -3px;
        left: -3px;
        right: -3px;
        bottom: -3px;
        background: conic-gradient(
          from 0deg,
          #00d2ff,
          #e2e8f0,
          #1e40af,
          #ffffff,
          #00d2ff
        );
        border-radius: 12px;
        z-index: -1;
        filter: blur(6px);
        animation: rotateBorder 3.5s linear infinite;
      }

      .badge::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        right: 3px;
        bottom: 3px;
        background: linear-gradient(180deg, #102038 0%, #08111f 100%);
        border-radius: 8px;
        z-index: -1;
      }

      .badge:hover {
        animation: glowPulse 1.2s infinite;
        transform: scale(1.05);
      }

      .footer {
        text-align: center;
        color: #94a3b8;
        font-size: 12px;
        padding: 8px 0 0;
        margin-top: 8px;
        position: relative;
        z-index: 1;
      }

      .footer b {
        color: var(--blue-accent);
        text-shadow: 0 0 10px rgba(0, 210, 255, 0.4);
      }

      .telegram-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px;
        margin-top: 12px;
        background: linear-gradient(90deg, #0b1526, #14284b);
        border: 2px solid #cbd5e1;
        border-radius: 14px;
        box-shadow: 0 0 15px rgba(0, 210, 255, 0.25);
      }

      .telegram-left amp-img {
        border-radius: 50%;
      }

      .telegram-center {
        flex: 1;
        text-align: left;
      }

      .tg-title {
        font-size: 14px;
        font-weight: 900;
        color: #ffffff;
        letter-spacing: 1px;
      }

      .tg-sub {
        font-size: 11px;
        color: #94a3b8;
        margin-top: 2px;
      }

      .telegram-right a {
        display: inline-block;
        padding: 8px 14px;
        border-radius: 10px;
        background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
        color: #050a14;
        font-weight: 900;
        font-size: 12px;
        text-decoration: none;
        box-shadow: 0 0 12px rgba(226, 232, 240, 0.5);
        white-space: nowrap;
        border: 1px solid #ffffff;
      }

      .telegram-right a:hover {
        transform: scale(1.05);
        background: linear-gradient(135deg, #00d2ff 0%, #ffffff 100%);
      }
    </style>
  </head>
